# The cheapest way to run the whole backend: ONE droplet, everything in Docker.
# Postgres, Valkey (Redis), the API, the realtime gateway, the workers,
# LiveKit (rooms' audio and video), and Caddy in front for HTTPS.
#
# For development and testers only (infra/dev/README.md). Production is the
# Terraform in infra/envs/, with managed Postgres and real backups.

x-backend: &backend
  image: dhun-backend:dev
  pull_policy: never
  env_file: dev.env
  # LiveKit's address and keys come from .env, the one place the livekit
  # service also reads them, so the two can never disagree.
  environment:
    LIVEKIT_URL: wss://${LIVEKIT_HOST:?set LIVEKIT_HOST in .env}
    LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}
    LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
    valkey:
      condition: service_healthy
  logging: &logging
    driver: json-file
    options: { max-size: '10m', max-file: '3' }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dhun
      POSTGRES_DB: dhun
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    # Sized for a 2 GB droplet shared with everything else.
    command: >
      postgres -c max_connections=60 -c shared_buffers=128MB
               -c effective_cache_size=384MB -c work_mem=4MB
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dhun -d dhun']
      interval: 5s
      retries: 20
    logging: *logging

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ['valkey-server', '--maxmemory', '64mb', '--maxmemory-policy', 'allkeys-lru', '--save', '']
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      retries: 20
    logging: *logging

  # Runs the migrations as the owner, applies ops/roles.sql (so the app runs as
  # dhun_app, without UPDATE on the ledger), then exits. Every start re-runs it;
  # an already-applied migration is skipped.
  migrate:
    image: dhun-backend:dev
    build: ../../backend
    env_file: dev.env
    command: ['migrate']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    logging: *logging

  api:
    <<: *backend
    command: ['api']

  gateway:
    <<: *backend
    command: ['gateway']

  worker:
    <<: *backend
    command: ['worker']

  # The media server. HOST networking, because WebRTC hands clients the
  # server's own address and Docker's NAT would hand them a private one.
  #   7880/tcp  signalling: NOT open in the firewall, reached only through
  #             Caddy as wss://{LIVEKIT_HOST}
  #   7881/tcp  media over TCP, the fallback for networks that block UDP
  #   7882/udp  ALL media on one port (muxed), instead of a 10,000-port range
  # Single node, so no Redis. Webhooks go to the API by its public name: from
  # the host network the compose service names do not resolve.
  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    network_mode: host
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - https://${API_HOST}/v1/webhooks/livekit
        logging:
          level: info
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_HOST: ${API_HOST:?set API_HOST in .env}
      LIVEKIT_HOST: ${LIVEKIT_HOST:?set LIVEKIT_HOST in .env}
    # LiveKit is on the host network; this name reaches it from Caddy's.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, gateway]
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
